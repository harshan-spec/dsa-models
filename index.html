<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a0b" />
    <meta name="description" content="A searchable terminal-style index of the IT22311 Data Structures and Algorithm Laboratory programs." />
    <title>dsa-models · Data Structures Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="dsa-models home">
          <span class="brand-caret">›</span>
          <span>dsa-models</span>
        </a>
        <div class="topbar-status" aria-label="Library status">
          <span class="status-dot" aria-hidden="true"></span>
        </div>
      </header>
      <main>
        <section class="intro" aria-labelledby="page-title">
          <div class="command-line"><span class="command-prompt">student@lab:~$</span> index --all-programs</div>
          <div class="intro-row">
            <div>
              <p class="eyebrow">IT22311 · DATA STRUCTURES &amp; ALGORITHM LABORATORY</p>
            </div>
            <div class="intro-note">
              <span class="note-mark">//</span>
            </div>
          </div>

          <div class="search-shell">
            <label class="sr-only" for="searchInput">Search questions and concepts</label>
            <span class="search-glyph" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search a question or concept…" />
            <kbd>/</kbd>
            <button class="clear-search" id="clearSearch" type="button" aria-label="Clear search" hidden>clear</button>
          </div>
          <div class="search-footnote">
          </div>
        </section>

        <section class="library-layout" aria-label="Program library">
          <aside class="exercise-sidebar">
            <div class="sidebar-heading">
              <span>EXERCISES</span>
              <span class="sidebar-count" id="exerciseCount">09</span>
            </div>
            <nav id="exerciseNav" aria-label="Exercises"></nav>
            <div class="sidebar-foot">
              <span class="status-dot" aria-hidden="true"></span>
            </div>
          </aside>

          <div class="results-column">
            <div class="results-toolbar">
              <div>
                <p class="section-kicker">PROGRAM INDEX</p>
                <p class="results-summary" id="resultsSummary" aria-live="polite"></p>
              </div>
              <button class="ghost-button" id="copyVisible" type="button">copy visible</button>
            </div>
            <div id="exerciseList"></div>
            <div class="empty-state" id="emptyState" hidden>
              <span class="empty-prompt">404</span>
              <h2>No matching program</h2>
              <p>Try a broader question or a concept like <button type="button" class="inline-link" data-query="linked list">linked list</button>.</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span>·</span>
        <span>copy the code, keep the concepts</span>
      </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
